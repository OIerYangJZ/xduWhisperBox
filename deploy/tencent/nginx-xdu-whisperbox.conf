upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 生产环境建议：
# 1. server_name 改成正式域名
# 2. 启用 HTTPS，并将 80 重定向到 443
# 3. 普通学生邮箱登录不依赖 IDS；只有启用可选统一认证桥接时才需要配置 BACKEND_XIDIAN_PUBLIC_ORIGIN

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    access_log /var/log/nginx/xdu-whisperbox.access.log;
    error_log  /var/log/nginx/xdu-whisperbox.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    location / {
        root /opt/xdu-whisperbox/current/build/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        location ~* \.(mp4|webm|ogg|mp3|wav|pdf|zip|tar|gz)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_request_buffering off;
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.seediantreehole.cn seediantreehole.cn www.seediantreehole.cn;

    return 301 https://www.seediantreehole.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.seediantreehole.cn;

    # 将下面两个路径替换成腾讯云 SSL 控制台下载并上传到服务器的证书文件。
    ssl_certificate     /etc/nginx/ssl/app.seediantreehole.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/app.seediantreehole.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://www.seediantreehole.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seediantreehole.cn;

    # 将下面两个路径替换成腾讯云 SSL 控制台下载并上传到服务器的证书文件。
    ssl_certificate     /etc/nginx/ssl/www.seediantreehole.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.seediantreehole.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://www.seediantreehole.cn$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.seediantreehole.cn _;

    # 将下面两个路径替换成腾讯云 SSL 控制台下载并上传到服务器的证书文件。
    ssl_certificate     /etc/nginx/ssl/www.seediantreehole.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.seediantreehole.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20m;

    # 日志配置
    access_log /var/log/nginx/xdu-whisperbox.access.log;
    error_log  /var/log/nginx/xdu-whisperbox.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    # 静态资源：Flutter Web 构建产物
    location / {
        root /opt/xdu-whisperbox/current/build/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML 文件不缓存（由 build hash 控制的 JS/CSS 通过长期缓存实现更新）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 缓存策略（由 build hash 控制，长期缓存已命名的资源）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # 媒体文件中等缓存
        location ~* \.(mp4|webm|ogg|mp3|wav|pdf|zip|tar|gz)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer 配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 健康检查接口允许的请求体大小
        proxy_request_buffering off;
    }

    # Nginx 自身健康检查（给云负载均衡器使用）
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
